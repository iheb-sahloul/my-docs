name: 🚀 Deployment

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            ref:
                description: Branch to deploy
                default: main
                required: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: ⤵️ Checkout code
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.ref }}

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.x'

            # Private notes are encrypted in git (see .gitattributes); decrypt before checks/build
            - name: 🔓 Decrypt private notes
              run: |
                  curl -fsSL https://raw.githubusercontent.com/elasticdog/transcrypt/v2.3.2/transcrypt -o /usr/local/bin/transcrypt
                  chmod +x /usr/local/bin/transcrypt
                  transcrypt -y -c aes-256-cbc -p "${{ secrets.TRANSCRYPT_PASSWORD }}"

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: ✅ Docs checks
              run: python scripts/check_docs.py

            # EN first: it cleans site/, then FR builds into site/fr/
            - name: 🏗️ Build EN + FR
              run: |
                  zensical build --strict
                  zensical build --strict -f mkdocs.fr.yml

            # Password-protect built private pages (client-side AES, unlocked in the browser)
            - name: 🔒 Encrypt private pages
              run: |
                  npx -y staticrypt@3 site/fr/private -r -d site/fr/private \
                    -p "${{ secrets.PAGES_PASSWORD }}" --remember 30
                  # fail if any private page is still plaintext
                  ! grep -rL staticrypt site/fr/private --include=*.html | grep .

            - uses: actions/upload-pages-artifact@v4
              with:
                  path: site

            - name: 🚀 Deploy documentation
              id: deployment
              uses: actions/deploy-pages@v4
