# Shared by mkdocs.yml (EN) and mkdocs.fr.yml (FR). Lists here get appended to, not replaced, so nav lives in each language file.
site_name: My Docs
site_url: https://iheb-sahloul.github.io/my-docs/
site_author: Iheb Sahloul

repo_name: iheb-sahloul/my-docs
repo_url: https://github.com/iheb-sahloul/my-docs

# docs/fr/private is a git-ignored symlink to private/ for reading in the IDE; never publish it
exclude_docs: |
  private/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono

# one build per language (EN here, FR in mkdocs.fr.yml); this is the language switcher
extra:
  alternate:
    - name: English
      link: /my-docs/
      lang: en
    - name: Français
      link: /my-docs/fr/
      lang: fr

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.blocks.caption
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc
