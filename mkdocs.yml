site_name: My Docs
site_url: https://iheb-sahloul.github.io/my-docs/
site_author: Iheb Sahloul

repo_name: iheb-sahloul/my-docs
repo_url: https://github.com/iheb-sahloul/my-docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Interview: Entretien
            Overview: Vue d'ensemble
            Persistence & SQL: Persistance & SQL
            Claude Code & AI-assisted Dev: Claude Code & Dev assisté par IA
            Mock Interview Checklist: Checklist d'entretien blanc

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.blocks.caption
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc

nav:
- Home: index.md
- Interview:
  - Overview: interviews/index.md
  - Java Core & JVM: interviews/java-core-jvm.md
  - Spring & Architecture: interviews/spring-architecture.md
  - Persistence & SQL: interviews/persistence-sql-postgres.md
  - Messaging: interviews/messaging-rabbitmq-kafka.md
  - React & TypeScript: interviews/react-typescript.md
  - Full Stack & DevOps: interviews/fullstack-devops-k8s.md
  - System Design & Leadership: interviews/system-design-leadership.md
  - Claude Code & AI-assisted Dev: interviews/claude-code.md
  - Mock Interview Checklist: interviews/mock-interview.md
