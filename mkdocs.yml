site_name: My Docs
site_url: https://iheb-sahloul.github.io/my-docs/
site_author: Iheb Sahloul

repo_name: iheb-sahloul/my-docs
repo_url: https://github.com/iheb-sahloul/my-docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Interview: Entretien
            Leadership & Behavioral (STAR): Leadership & Comportemental (STAR)
            Overview: Vue d'ensemble
            Persistence & SQL: Persistance & SQL
            AI Engineering & Claude Code: Ingénierie IA & Claude Code
            SQL Query Tuning: Optimisation des requêtes SQL
            Resources: Ressources
            Mock Interview Checklist: Checklist d'entretien blanc
            Best Practices: Bonnes pratiques
            Further Reading: Pour aller plus loin
            REST API Design: Conception d'API REST
            Performance & Load Testing: Performance & tests de charge
            Testing: Tests
            Security: Sécurité
            Live Coding: Live coding
            Observability: Observabilité
            AI Prompts: Prompts IA
            Messaging: Messagerie
            System Design: Conception de systèmes
            Caching & Redis: Cache & Redis

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.blocks.caption
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc

nav:
- Home: index.md
- Interview:
  - Overview: interviews/index.md
  - Design Patterns: interviews/design-patterns.md
  - Java Core & JVM: interviews/java-core-jvm.md
  - Kotlin: interviews/kotlin.md
  - Spring & Architecture: interviews/spring-architecture.md
  - Persistence & SQL: interviews/persistence-sql-postgres.md
  - Messaging: interviews/messaging-rabbitmq-kafka.md
  - React & TypeScript: interviews/react-typescript.md
  - Full Stack & DevOps: interviews/fullstack-devops-k8s.md
  - System Design: interviews/system-design.md
  - Caching & Redis: interviews/caching-redis.md
  - Leadership & Behavioral (STAR): interviews/leadership-behavioral.md
  - AI Engineering & Claude Code: interviews/claude-code.md
  - Testing: interviews/testing.md
  - Security: interviews/security.md
  - Live Coding: interviews/coding.md
  - Cloud (AWS): interviews/cloud-aws.md
  - REST API Design: interviews/rest-api.md
  - Performance & Load Testing: interviews/performance-load-testing.md
  - Observability: interviews/observability.md
  - Mock Interview Checklist: interviews/mock-interview.md
- Notes:
  - Git: notes/git.md
  - Java: notes/java.md
  - Maven & Gradle: notes/maven-gradle.md
  - SQL Query Tuning: notes/sql.md
  - Postgres: notes/postgres.md
  - Docker: notes/docker.md
  - Kubernetes: notes/kubernetes.md
  - Terraform: notes/terraform.md
  - Linux: notes/linux.md
  - Kafka & RabbitMQ: notes/messaging.md
  - "HTTP: curl & jq": notes/http-curl-jq.md
  - AI: notes/ai.md
- Best Practices:
  - Git: best-practices/git.md
  - Java: best-practices/java.md
  - Spring Boot: best-practices/spring-boot.md
  - Testing: best-practices/testing.md
  - Security: best-practices/security.md
  - Observability: best-practices/observability.md
  - REST API: best-practices/rest-api.md
  - Messaging: best-practices/messaging.md
  - Architecture: best-practices/architecture.md
  - React & TypeScript: best-practices/react-typescript.md
  - SQL, JPA & Postgres: best-practices/sql-jpa-postgres.md
  - Docker, K8s & DevOps: best-practices/docker-k8s-devops.md
  - CI/CD: best-practices/ci-cd.md
  - AI Prompts: best-practices/ai-prompts.md
- Resources:
  - Further Reading: resources/further-reading.md

# private/ is symlinked here by scripts/private_pages.py for local reading; never publish it
exclude_docs: |
  fr/private/
  en/private/

validation:
  anchors: warn
  unrecognized_links: warn
